# Render Blueprint: creates the MediFlow API web service in one click.
#
# Dashboard -> New + -> Blueprint -> select the mediflow repo -> Apply.
# Render reads this file and fills in everything below; you only type the
# values marked `sync: false` (they are never stored in git - that is the
# whole point: infrastructure as code, secrets in the dashboard).
#
# FREE-TRIAL WARNINGS - read before putting real patient data here:
#  1. The free plan has no persistent disk, so SQLite lives on an ephemeral
#     filesystem: EVERY redeploy wipes the database. Create the owner LAST,
#     then push no more code until you attach a disk (requires Starter+).
#  2. Free instances spin down after inactivity: first request after idle
#     takes 50+ seconds.
#  Upgrade path when ready: Starter plan + a 1GB disk mounted at /data, then
#  set DATABASE_FILE=/data/mediflow.db and UPLOADS_DIR=/data/uploads.

services:
  - type: web
    name: mediflow-api
    runtime: node
    plan: free
    # Repo root: the API builds through npm workspaces, which need the root
    # package.json and package-lock.json.
    # --include=dev: Render sets NODE_ENV=production, which makes npm skip
    # devDependencies - including typescript itself. The types package above
    # moved to dependencies as well, so the build survives pruning either way.
    buildCommand: npm ci --include=dev && npm run build --workspace @mediflow/api
    # Migrations run automatically on boot (src/index.ts); no migrate step.
    startCommand: npm run start --workspace @mediflow/api
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Pin Node 22: Render otherwise installs the engines floor (20.11.0),
      # which predates require(esm) - @fastify/jwt's jose dependency crashes
      # on boot there with ERR_REQUIRE_ESM. Local dev runs 22.
      - key: NODE_VERSION
        value: "22"
      # Render injects PORT itself; HOST defaults to 0.0.0.0 in config.
      # ---- Required secrets (typed in the dashboard, never in git) ----
      - key: JWT_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      # ---- Browser access: without this the Firebase site is blocked ----
      - key: CORS_ORIGINS
        value: https://mediflow-baalbeck.web.app
      # ---- WhatsApp: production refuses the simulator ----
      - key: WHATSAPP_PROVIDER
        value: cloud
      # ---- Link-a-device: the gateway service from the other tab ----
      - key: GATEWAY_URL
        value: https://mediflow-xn3c.onrender.com
      - key: GATEWAY_ADMIN_TOKEN
        sync: false
      # ---- Password reset emails (optional; without SMTP_HOST the
      #        forgot-password endpoint answers 503 instead of lying) ----
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: PUBLIC_WEB_URL
        value: https://mediflow-baalbeck.web.app
      # ---- Reminders: OFF by default in production, Beirut time ----
      - key: REMINDER_WORKER_ENABLED
        value: "true"
      - key: DEFAULT_TIMEZONE
        value: Asia/Beirut
